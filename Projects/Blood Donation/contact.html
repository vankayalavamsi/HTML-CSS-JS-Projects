<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">🩸 BloodBank</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="donate.html">Donate</a>
            <a href="getdonor.html">Find Donor</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="container">
        <h2>Contact Us</h2>
        <p>Have questions? Send us a message below.</p>
        <form id="contactForm">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="contactName" required>
            </div>
            <div class="form-group">
                <label>Your Email</label>
                <input type="email" id="contactEmail" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea id="contactMessage" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn">Send Message</button>
        </form>
        <p class="status-msg" id="contactMsg"></p>
    </div>

    <script src="contact.js"></script>
</body>
</html>

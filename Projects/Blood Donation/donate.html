<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Donate Blood</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">🩸 BloodBank</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="getdonor.html">Find Donor</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="container">
        <h2>Register to Donate</h2>
        <form id="donateForm">
            <div class="form-group">
                <label>Donor Name</label>
                <input type="text" id="donorName" required>
            </div>
            <div class="form-group">
                <label>Blood Group</label>
                <select id="bloodGroup" required>
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" id="donorCity" required>
            </div>
            <button type="submit" class="btn">Submit Donation Details</button>
        </form>
        <p class="status-msg" id="donateMsg"></p>
    </div>

    <script src="donate.js"></script>
</body>
</html>

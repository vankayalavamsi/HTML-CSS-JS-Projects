<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Marks Calculator</h1>
            <p>Calculate your academic performance easily</p>
        </header>

        <div class="main-content">

            <div class="subjects-section">

                <h2>Enter Your Marks</h2>

                <div class="subjects-grid">

                    <div class="input-group">
                        <label>English</label>
                        <input type="number" class="marks" placeholder="0" min="0" max="100">
                    </div>

                    <div class="input-group">
                        <label>Hindi</label>
                        <input type="number" class="marks" placeholder="0" min="0" max="100">
                    </div>

                    <div class="input-group">
                        <label>Mathematics</label>
                        <input type="number" class="marks" placeholder="0" min="0" max="100">
                    </div>

                    <div class="input-group">
                        <label>Science</label>
                        <input type="number" class="marks" placeholder="0" min="0" max="100">
                    </div>

                    <div class="input-group">
                        <label>Social Science</label>
                        <input type="number" class="marks" placeholder="0" min="0" max="100">
                    </div>

                    <div class="input-group">
                        <label>General Knowledge</label>
                        <input type="number" class="marks" placeholder="0" min="0" max="100">
                    </div>

                    <div class="input-group">
                        <label>Computer</label>
                        <input type="number" class="marks" placeholder="0" min="0" max="100">
                    </div>

                    <div class="input-group">
                        <label>Physics</label>
                        <input type="number" class="marks" placeholder="0" min="0" max="100">
                    </div>

                    <div class="input-group">
                        <label>Chemistry</label>
                        <input type="number" class="marks" placeholder="0" min="0" max="100">
                    </div>

                    <div class="input-group">
                        <label>Biology</label>
                        <input type="number" class="marks" placeholder="0" min="0" max="100">
                    </div>

                    <div class="input-group">
                        <label>History</label>
                        <input type="number" class="marks" placeholder="0" min="0" max="100">
                    </div>

                    <div class="input-group">
                        <label>Civics</label>
                        <input type="number" class="marks" placeholder="0" min="0" max="100">
                    </div>

                    <div class="input-group">
                        <label>Geography</label>
                        <input type="number" class="marks" placeholder="0" min="0" max="100">
                    </div>

                    <div class="input-group">
                        <label>Economics</label>
                        <input type="number" class="marks" placeholder="0" min="0" max="100">
                    </div>

                </div>

                <div class="full-marks">
                    <label>Full Marks</label>
                    <input type="number" id="fullMarks" value="1400" min="1">
                </div>

                <div class="buttons">
                    <button id="calculateBtn">Calculate Results</button>
                    <button id="resetBtn">Reset</button>
                </div>

            </div>

            <div class="results-section">

                <h2>Your Results</h2>

                <div class="result-card total">
                    <div>
                        <p>Total Marks</p>
                        <h3 id="total">0 / 1400</h3>
                    </div>
                    <span>📚</span>
                </div>

                <div class="result-card percentage">
                    <div>
                        <p>Percentage</p>
                        <h3 id="percentage">0%</h3>
                    </div>
                    <span>📊</span>
                </div>

                <div class="result-card grade">
                    <div>
                        <p>Grade</p>
                        <h3 id="grade">-</h3>
                    </div>
                    <span>🏆</span>
                </div>

                <div class="result-card cgpa">
                    <div>
                        <p>CGPA</p>
                        <h3 id="cgpa">0</h3>
                    </div>
                    <span>⭐</span>
                </div>

                <div class="progress-container">
                    <p>Overall Performance</p>
                    <div class="progress-bar">
                        <div id="progress"></div>
                    </div>
                    <span id="performance">Start entering your marks!</span>
                </div>

            </div>

        </div>

        <footer>
            <p>Designed with ❤️ | Marks Calculator</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>

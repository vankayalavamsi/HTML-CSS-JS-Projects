<!-- Hostel-Management-System/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Management System - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-loader" id="loginLoader">
        <div class="loader-spinner"></div>
    </div>
    <div class="login-container" id="loginContainer" style="display:none;">
        <div class="login-left">
            <div class="login-brand">
                <i class="fas fa-building"></i>
                <h1>HostelMS</h1>
                <p>Complete Hostel Management Solution</p>
            </div>
            <div class="login-features">
                <div class="login-feature"><i class="fas fa-bed"></i><span>Room Management</span></div>
                <div class="login-feature"><i class="fas fa-users"></i><span>Student Tracking</span></div>
                <div class="login-feature"><i class="fas fa-money-bill-wave"></i><span>Fee Management</span></div>
                <div class="login-feature"><i class="fas fa-chart-bar"></i><span>Reports & Analytics</span></div>
                <div class="login-feature"><i class="fas fa-shield-alt"></i><span>Secure & Reliable</span></div>
            </div>
        </div>
        <div class="login-right">
            <div class="login-tabs">
                <button class="login-tab active" data-tab="admin">Admin Login</button>
                <button class="login-tab" data-tab="student">Student Login</button>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="loginId"><i class="fas fa-user"></i> User ID</label>
                    <input type="text" id="loginId" placeholder="Enter your ID" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div class="form-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe"> Remember Me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <div class="login-hint">
                    <p>Admin: <strong>admin</strong> / <strong>admin123</strong></p>
                    <p>Student: <strong>STU001</strong> / <strong>stu123</strong></p>
                </div>
            </form>
        </div>
    </div>
    <div id="toastContainer" class="toast-container"></div>
    <script src="js/storage.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>

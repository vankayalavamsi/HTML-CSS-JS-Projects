<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup | Myntra Clone</title>

<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-container">

    <form id="signupForm">

        <h2>Create Account</h2>

        <input
        type="text"
        id="signupName"
        placeholder="Full Name"
        required>

        <input
        type="email"
        id="signupEmail"
        placeholder="Email"
        required>

        <input
        type="password"
        id="signupPassword"
        placeholder="Password"
        required>

        <button type="submit">
            Register
        </button>

        <p>
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </p>

    </form>

</div>

<script src="js/auth.js"></script>

</body>
</html>
